<div class="container">
<h1>Book List works!</h1>
<input type="text" [(ngModel)]="item"/>
<button class="btn btn-primary" (click)="addItems()">Add Book</button>
<ul>
  <li *ngFor="let book of bookLit; let i = index">
    {{book}}
    <button class="btn btn-danger" (click)="deleteBook(i)">Delete</button>
  </li>
</ul>
</div>
