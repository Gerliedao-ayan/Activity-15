<div class="container">
<h1>Game List works!</h1>
<input type="text" [(ngModel)]="item"/>
<button class="btn btn-primary" (click)="addItems()">Add Game</button>
<ul>
  <li *ngFor="let game of gameLis; let i = index">
    {{game}}
    <button class="btn btn-danger" (click)="deleteGame(i)">Delete</button>
  </li>
</ul>
</div>
