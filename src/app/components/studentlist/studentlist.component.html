<div class="container">
  <h1>Student List</h1>
  <input type="text" [(ngModel)]="item"/>
  <button class="btn btn-primary" (click)="addItems()">Add Student</button>
  <ul>
    <li *ngFor="let student of studentLis; let i = index">
      {{student}}
      <button class="btn btn-danger" (click)="deleteStudent(i)">Delete</button>
    </li>
  </ul>
</div>
